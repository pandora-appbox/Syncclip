name: Check and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: server
      - run: go test -race ./... && go vet ./...
        working-directory: server
      - run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o syncclip-server .
        working-directory: server
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: syncclip-server-linux-amd64
          path: server/syncclip-server
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-3.0 python3-venv
      - run: python3 -m venv --system-site-packages .venv && .venv/bin/python -m pip install -r linux/requirements.txt
      - run: python3 scripts/audit-dependencies.py --requirements linux/requirements.txt
      - run: PYTHONPATH=linux .venv/bin/python -m unittest discover -s tests -v
  https-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: deploy/https/go.mod
          cache-dependency-path: deploy/https/go.sum
      - run: go mod verify
        working-directory: deploy/https
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: deploy/https
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest lintDebug
        working-directory: android
      - run: ./gradlew --no-daemon buildEnvironment :app:dependencies --configuration releaseRuntimeClasspath > dependency-report.txt
        working-directory: android
      - run: python3 scripts/audit-dependencies.py --gradle-report android/dependency-report.txt
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: syncclip-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
