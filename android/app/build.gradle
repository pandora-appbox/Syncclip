plugins { id 'com.android.application' }

android {
    namespace 'dev.syncclip'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'dev.syncclip'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '0.5.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('SYNCCLIP_KEYSTORE')) {
                storeFile file(System.getenv('SYNCCLIP_KEYSTORE'))
                storePassword System.getenv('SYNCCLIP_STORE_PASSWORD')
                keyAlias 'syncclip'
                keyPassword System.getenv('SYNCCLIP_STORE_PASSWORD')
            }
        }
    }
    sourceSets { main { assets.srcDirs += ['../../linux/syncclip/locales', '../../licenses', '../../linux/syncclip/resources'] } }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('SYNCCLIP_KEYSTORE')) signingConfig signingConfigs.release
        }
        debug { if (System.getenv('SYNCCLIP_KEYSTORE')) signingConfig signingConfigs.release }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // ZXing calls ContextCompat/ActivityCompat for camera permission at runtime.
    implementation 'androidx.core:core:1.17.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
