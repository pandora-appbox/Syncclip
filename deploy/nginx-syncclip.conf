# Include inside the HTTPS virtual host. Keep limits local to Syncclip:
# the surrounding site may permit large uploads for unrelated applications.
location ^~ /syncclip/v1/blobs/ {
    if ($request_method !~ ^(GET|HEAD|PUT)$) { return 405; }
    client_max_body_size 33m;
    client_body_timeout 90s;
    proxy_pass http://127.0.0.1:8787/v1/blobs/;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    access_log off;
}
location = /syncclip/v1/ws {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($http_content_length !~ ^(0)?$) { return 413; }
    if ($http_transfer_encoding != "") { return 413; }
    client_max_body_size 1k;
    client_body_timeout 10s;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:8787/v1/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    access_log off;
}
location = /syncclip/healthz {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($http_content_length !~ ^(0)?$) { return 413; }
    if ($http_transfer_encoding != "") { return 413; }
    client_max_body_size 1k;
    client_body_timeout 10s;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:8787/healthz;
    access_log off;
}

# Device registration, one-use invitations and revocation.
location ^~ /syncclip/v1/ {
    if ($request_method !~ ^(GET|HEAD|POST|DELETE)$) { return 405; }
    client_max_body_size 4k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:8787/v1/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 20s;
    access_log off;
}
